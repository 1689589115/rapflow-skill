[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapflow-skill"
version = "1.5.0"
description = "Chinese Rap Lyric Analysis Tool for LLM Function Call - Multi-Rhyme Detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "1689589115"}
]
keywords = ["rap", "lyrics", "rhyme", "analysis", "nlp", "chinese", "llm", "multi-rhyme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/1689589115/rapflow-skill"
Repository = "https://github.com/1689589115/rapflow-skill"
Issues = "https://github.com/1689589115/rapflow-skill/issues"
"Release Notes" = "https://github.com/1689589115/rapflow-skill/releases/tag/v1.3.0"

[tool.setuptools.packages.find]
include = ["skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
